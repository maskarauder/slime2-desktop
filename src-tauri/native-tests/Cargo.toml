[package]
name = "slime2-transport-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
futures = "=0.3.34"
log = "=0.4.33"
reqwest = "=0.13.4"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "aws_lc_rs", "std", "tls12"] }
serde_json = "=1.0.151"
semver = "=1.0.28"
url = "=2.5.8"
zip = "=8.6.0"
tokio = { version = "=1.53.1", features = ["full"] }
warp = { version = "=0.4.3", features = ["server", "websocket"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dev)'] }
