[package]
name = "slime2-youtube-stream"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tonic = { version = "0.14.6", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14.6"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14.6"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
