name: 'publish'

on:
  workflow_dispatch:
  push:
    branches:
      - release/test
      - release/beta
      - release/live
      - release/debug

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

env:
  VERSION_SUFFIX: ${{ case(github.ref_name == 'release/live', '' ,github.ref_name == 'release/beta', '-beta', github.ref_name == 'release/debug', '-debug', '-test') }}

jobs:
  prepare-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.release.outputs.app_version }}
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
      arch_linux_file_name: ${{ steps.release.outputs.arch_linux_file_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check release version and public update key
        run: |
          npm run version:check
          node scripts/updater-config.mjs --check

      - name: Require private signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '::error::Set TAURI_SIGNING_PRIVATE_KEY before publishing. See docs/AUTOMATIC-UPDATES.md.'
            exit 1
          fi

      - name: Prepare unpublished release
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = `v${version}${process.env.VERSION_SUFFIX}`;
            const { owner, repo } = context.repo;
            let tagObject;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              tagObject = ref.data.object;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            // An existing lightweight/annotated tag must identify this exact source.
            for (let depth = 0; tagObject?.type === 'tag' && depth < 8; depth++) {
              const annotated = await github.rest.git.getTag({ owner, repo, tag_sha: tagObject.sha });
              tagObject = annotated.data.object;
            }
            if (tagObject && (tagObject.type !== 'commit' || tagObject.sha !== context.sha)) {
              throw new Error(`${tag} already points at different source. Use a new version; do not move a published tag.`);
            }
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let release = releases.find(item => item.tag_name === tag);
            if (release && !release.draft) {
              throw new Error(`${tag} is already public. Increment the numeric app version instead of replacing installed update assets.`);
            }
            if (release && release.target_commitish !== context.sha) {
              throw new Error(`${tag} is a draft from a different commit. Use a new version, or delete that unpublished draft and rerun every build.`);
            }
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `Slime2 ${tag}`, draft: true,
                prerelease: process.env.VERSION_SUFFIX !== '',
                body: 'See the assets to download this version and install. Automatic updates use the signed installers and latest.json.',
              }));
            }
            core.setOutput('app_version', version);
            core.setOutput('release_id', release.id);
            core.setOutput('tag', tag);
            core.setOutput('arch_linux_file_name', `Slime2-v${version}${process.env.VERSION_SUFFIX}_Arch-Linux.zip`);

  publish-tauri:
    needs: prepare-release
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Intel based Mac
            args: '--target x86_64-apple-darwin'
            output_arch: 'X64'
          - platform: 'macos-latest' # Arm based Mac (M1 and above)
            args: '--target aarch64-apple-darwin'
            output_arch: 'ARM64'
          - platform: 'ubuntu-22.04' # Linux
            args: ''
          - platform: 'ubuntu-22.04-arm' # Arm based Linux
            args: ''
          - platform: 'windows-latest' # Windows 10/11
            args: ''
          - platform: 'windows-11-arm' # Arm based Windows 11
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev xdg-utils patchelf

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src-overlay/package-lock.json

      - name: Install Rust (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # These targets are only used on macOS runners so it's in an `if` to slightly speed up Windows and Linux builds.
          targets: ${{ case(runner.os == 'macOS', 'aarch64-apple-darwin,x86_64-apple-darwin', '') }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/native-tests -> target
            src-tauri/youtube-stream -> target

      - name: NPM Install Frontend Dependencies
        run: npm run setup

      - name: Verify source and transports
        run: npm run verify

      - name: Tauri Info
        run: npm run tauri info

      - name: Build Binaries
        id: tauri-build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE_SUFFIX: ${{ format('{0}-{1}', runner.os, matrix.output_arch || runner.arch) }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: 'Slime2 ${{ needs.prepare-release.outputs.tag }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: ${{ github.ref_name != 'release/live' }}
          # Only release builds require signatures; ordinary local/PR builds do not.
          args: >-
            ${{ matrix.args }}
            ${{ github.ref_name == 'release/debug' && '--debug' || '' }}
            --config '{"bundle":{"createUpdaterArtifacts":true}}'
          # Build the complete manifest once, after all matrix jobs finish.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: false
          retryAttempts: 3
          releaseAssetNamePattern: 'Slime2-v[version]${{ env.VERSION_SUFFIX }}_${{ env.FILE_SUFFIX }}[ext]'

  publish-release:
    permissions:
      contents: write
    needs: [prepare-release, publish-tauri]
    runs-on: ubuntu-22.04
    env:
      APP_VERSION: ${{ needs.prepare-release.outputs.app_version }}
      RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify complete signed update manifest and publish
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { publishSignedRelease } = await import(pathToFileURL(resolve('scripts/publish-release.mjs')).href);
            const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            await publishSignedRelease({
              github, context,
              version: process.env.APP_VERSION,
              versionSuffix: process.env.VERSION_SUFFIX,
              releaseId: Number(process.env.RELEASE_ID),
              publicKey: config.plugins.updater.pubkey,
              log: message => core.info(message),
            });

  publish-pkgbuild:
    permissions:
      contents: write
    # updpkgsums downloads .deb assets by public URL, so this follows publication.
    needs: [prepare-release, publish-release]
    env:
      APP_VERSION: ${{ needs.prepare-release.outputs.app_version }}
      RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
      FILE_NAME: ${{ needs.prepare-release.outputs.arch_linux_file_name }}

    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Arch release channel
        run: |
          sed -i "s/^_release_suffix=.*/_release_suffix='${VERSION_SUFFIX}'/" pkgbuild/PKGBUILD

      - name: Update PKGBUILD
        uses: heyhusen/archlinux-package-action@v3.0.1
        with:
          path: pkgbuild
          pkgver: ${{ env.APP_VERSION }}
          pkgrel: 1
          updpkgsums: true
          # Only update the recipe and checksums for the downloadable ZIP.
          flags: ''

      - name: Create Arch Linux ZIP
        uses: thedoctor0/zip-release@0.7.6
        with:
          path: pkgbuild
          type: 'zip'
          filename: ${{ env.FILE_NAME }}
          custom: '--junk-paths'

      - name: Upload ZIP to Release
        uses: svenstaro/upload-release-action@v2
        with:
          release_id: ${{ env.RELEASE_ID }}
          file: ${{ env.FILE_NAME }}
          draft: false
